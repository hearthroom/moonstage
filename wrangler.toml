name = "moonstage-playground"
main = "worker/index.js"
compatibility_date = "2026-09-10"
workers_dev = false
preview_urls = false
# The explicit zone route takes precedence over the community sandbox wildcard.
routes = [
  { pattern = "playground.hearthroom.club", custom_domain = true },
  { pattern = "playground.sukisuki.ai", custom_domain = true },
  { pattern = "playground.sukisuki.ai/*", zone_name = "sukisuki.ai" },
  { pattern = "playground.sukisuki.chat", custom_domain = true },
  { pattern = "playground.sukisuki.chat/*", zone_name = "sukisuki.chat" },
  { pattern = "playground.hearthroom.club/*", zone_name = "hearthroom.club" }
]

[assets]
directory = "dist/build/h5"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
API_ORIGIN = "https://api.harperharbor.com"
